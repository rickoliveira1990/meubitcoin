<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#111318">
    <meta name="description" content="Meu Bitcoin está chegando. Registre suas compras periódicas de Bitcoin e acompanhe sua evolução.">
    <title>Meu Bitcoin — Em breve</title>
    <link rel="canonical" href="https://meubitcoin.tech/">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://meubitcoin.tech/">
    <meta property="og:site_name" content="Meu Bitcoin">
    <meta property="og:title" content="Meu Bitcoin — Em breve">
    <meta property="og:description" content="Registre suas compras periódicas de Bitcoin e acompanhe sua evolução.">
    <meta property="og:image" content="https://meubitcoin.tech/outputs/meu-bitcoin-logo-horizontal-transparente.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Meu Bitcoin — Em breve">
    <meta name="twitter:description" content="Registre suas compras periódicas de Bitcoin e acompanhe sua evolução.">
    <meta name="twitter:image" content="https://meubitcoin.tech/outputs/meu-bitcoin-logo-horizontal-transparente.png">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Meu Bitcoin",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "url": "https://meubitcoin.tech/",
        "description": "Aplicativo para registrar compras periódicas de Bitcoin e acompanhar a evolução do patrimônio em BTC."
      }
    </script>

    <style>
      :root {
        color-scheme: dark;
        --background: #111318;
        --text: #f7f3ec;
        --muted: #b9bdc7;
        --accent: #f7931a;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        width: min(100% - 3rem, 760px);
        padding: 2rem 0;
      }

      .logo {
        display: block;
        width: min(100%, 560px);
        height: auto;
        margin: 0 auto 2.25rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        letter-spacing: -0.035em;
      }

      p {
        max-width: 35ch;
        margin: 0.8rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.6;
      }

      .accent { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="outputs/meu-bitcoin-logo-horizontal-transparente.png"
        width="2172"
        height="724"
        alt="Meu Bitcoin"
      >
      <h1>Em breve</h1>
      <p>Uma forma simples de registrar suas compras e acompanhar a evolução do seu <span class="accent">Bitcoin</span>.</p>
    </main>
  </body>
</html>
